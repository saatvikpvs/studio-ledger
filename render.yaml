# Render Blueprint — one web service, exactly the process that runs locally:
# build the frontend, then run the FastAPI backend, which serves the built
# frontend itself. No separate frontend/backend split, no CORS to configure.
#
# To use: push this to GitHub, then in Render choose "New +" -> "Blueprint"
# and point it at this repo. Render reads this file and creates the service.
# DATABASE_URL and SECRET_KEY are marked sync: false -- Render will prompt
# for them in the dashboard rather than storing them in this file.
services:
  - type: web
    name: studio-ledger
    runtime: python
    plan: free
    buildCommand: >
      cd apps/web && npm install && npm run build &&
      cd ../api && pip install -r requirements.txt
    startCommand: cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false # paste your Neon connection string here, as postgresql+psycopg://...
      - key: SECRET_KEY
        sync: false # paste a long random string here (e.g. `openssl rand -hex 32`)
